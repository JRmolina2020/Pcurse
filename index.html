<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Vue 3</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

<div id="app" class="container mt-5">
    <h3 class="mb-4">Registro de Usuarios</h3>

    <!-- Formulario -->
    <div class="card mb-4">
        <div class="card-body">
            <form @submit.prevent="agregarUsuario">
                
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" class="form-control" v-model="form.nombre" required>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" class="form-control" v-model="form.telefono" required>
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card">
        <div class="card-body">
            <h5>Lista de Registros</h5>

            <table class="table table-bordered mt-3" v-if="usuarios.length > 0">
                <thead class="thead-dark">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(usuario, index) in usuarios" :key="index">
                        <td>{{ index + 1 }}</td>
                        <td>{{ usuario.nombre }}</td>
                        <td>{{ usuario.telefono }}</td>
                    </tr>
                </tbody>
            </table>

            <div v-else class="text-muted">
                No hay registros aún
            </div>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            form: {
                nombre: '',
                telefono: ''
            },
            usuarios: []
        }
    },
    methods: {
        agregarUsuario() {
            if (!this.form.nombre || !this.form.telefono) {
                alert('Todos los campos son obligatorios');
                return;
            }

            this.usuarios.push({
                nombre: this.form.nombre,
                telefono: this.form.telefono
            });

            // Limpiar formulario
            this.form.nombre = '';
            this.form.telefono = '';
        }
    }
}).mount('#app');
</script>

</body>
</html>
